# 운영 Supabase 에 supabase/migrations/ 의 새 SQL 을 적용한다.
# main 에 마이그레이션 파일이 바뀐 커밋이 들어오면 실행. 수동 실행(workflow_dispatch)도 main 에서만.
#
# 필요한 저장소 Secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN — supabase.com/dashboard/account/tokens 에서 발급
#   SUPABASE_DB_PASSWORD  — 운영 프로젝트 DB 비밀번호
# 권장: Settings > Environments > production 에서 Deployment branches 를 main 으로 제한.
#
# seed.sql 은 로컬 전용 — db push 는 시드를 넣지 않는다. 운영에 `supabase db reset --linked` 금지.
name: DB migrate

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # supabase CLI 가 이 환경 변수를 직접 읽으므로 --password 인자로 넘기지 않는다
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: hnerzaicnarejubjayoi
    steps:
      - name: Secrets 확인
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD Secrets 가 없어 운영 DB 에 마이그레이션을 적용하지 못했습니다."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: supabase link --project-ref "$PROJECT_REF"
      - name: 적용 예정 목록
        run: supabase db push --dry-run
      - run: supabase db push
