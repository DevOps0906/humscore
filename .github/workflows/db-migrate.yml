# 운영 Supabase 에 supabase/migrations/ 의 새 SQL 을 적용한다.
# main 에 마이그레이션 파일이 바뀐 커밋이 들어오면 실행. 수동 실행(workflow_dispatch)도 가능.
#
# 필요한 저장소 Secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN — supabase.com/dashboard/account/tokens 에서 발급
#   SUPABASE_DB_PASSWORD  — 운영 프로젝트 DB 비밀번호
# Secrets 가 없으면 아무것도 하지 않고 건너뛴다.
name: DB migrate

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 운영 DB 보호: GitHub Environments 에서 승인자 지정 가능
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: hnerzaicnarejubjayoi
    steps:
      - name: Secrets 확인
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD 가 없어 마이그레이션을 건너뜁니다."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ok == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - if: steps.secrets.outputs.ok == 'true'
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - if: steps.secrets.outputs.ok == 'true'
        name: 적용 예정 목록
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
      - if: steps.secrets.outputs.ok == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
