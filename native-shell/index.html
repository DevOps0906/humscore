<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HumScore</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #161826; color: #e9e9ed;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 24px; text-align: center; box-sizing: border-box; }
  h1 { font-size: 20px; font-weight: 500; margin: 0; }
  p { color: #9397ab; margin: 0; line-height: 1.5; }
  button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 8px; background: #9184d9; color: #161826;
    font-size: 16px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>인터넷에 연결할 수 없어요</h1>
  <p>HumScore는 온라인에서 동작합니다.<br />연결을 확인한 뒤 다시 시도해 주세요.</p>
  <button type="button" onclick="location.href='https://humscore.vercel.app/library'">다시 시도</button>
</main>
</body>
</html>
